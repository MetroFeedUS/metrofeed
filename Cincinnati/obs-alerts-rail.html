<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=400, height=700" />
  <title>RoamRaven TV — Alerts</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="RoamRavenbird.png" />
  <link rel="stylesheet" href="obs-alerts-rail.css?v=1" />
</head>
<body>
  <div class="mf-arail">
    <div class="mf-arail__head">
      <div class="mf-arail__kicker">Route alerts</div>
      <div id="mfArailRoute" class="mf-arail__title">Waiting for map…</div>
      <div id="mfArailStatus" class="mf-arail__status">Syncing with TV map</div>
    </div>
    <div id="mfArailBody" class="mf-arail__body">
      <div class="mf-arail__empty">Waiting for route from map source.</div>
    </div>
    <div class="mf-arail__foot">Follows map · updates every few seconds</div>
  </div>

  <script src="city-config.js"></script>
  <script>
    (function () {
      if (typeof CITIES !== 'undefined' && CITIES.cincinnati) {
        window.CITY_CONFIG = CITIES.cincinnati;
      }
    })();
  </script>
  <script src="mf-tv-alerts-api.js"></script>
  <script src="mf-tv-sync.js"></script>
  <script src="obs-alerts-rail.js?v=1"></script>
</body>
</html>
