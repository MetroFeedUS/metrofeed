<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoamRaven TV — Access</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="RoamRavenbird.png" />
  <style>
    :root { --rr-accent: #9333ea; --rr-bg: #0a0a0c; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--rr-bg);
      color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gate-form {
      padding: 2rem;
      background: #141418;
      border: 1px solid rgba(147, 51, 234, 0.45);
      border-radius: 12px;
      max-width: 360px;
      width: 90%;
      text-align: center;
    }
    h1 { color: var(--rr-accent); font-size: 1.35rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1rem; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #16161a;
      color: #fff;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 0.75rem;
    }
    button {
      width: 100%;
      background: var(--rr-accent);
      color: #fff;
      border: none;
      padding: 0.65rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7c3aed; }
    .err { color: #ff6b6b; font-size: 0.85rem; min-height: 1.2em; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="gate-form">
    <h1>RoamRaven TV</h1>
    <p>OBS director mode uses the live map at <code>home.html?tv=1</code>.</p>
    <input id="gateInput" type="password" autocomplete="off" placeholder="Access code" />
    <button type="button" id="gateSubmit">Enter broadcast</button>
    <div class="err" id="gateError"></div>
  </div>
  <script>
  (function () {
    var OBS_TV_ACCESS_CODE = 'admin2024';
    var AUTH_KEY = 'obsTvAuth';

    function goLive() {
      sessionStorage.setItem(AUTH_KEY, '1');
      window.location.replace('home.html?tv=1');
    }

    function tryUnlock() {
      var input = document.getElementById('gateInput');
      var err = document.getElementById('gateError');
      if (input.value === OBS_TV_ACCESS_CODE) {
        err.textContent = '';
        goLive();
      } else {
        err.textContent = 'Invalid access code';
        input.value = '';
        input.focus();
      }
    }

    document.getElementById('gateSubmit').addEventListener('click', tryUnlock);
    document.getElementById('gateInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryUnlock();
    });

    if (sessionStorage.getItem(AUTH_KEY) === '1') {
      goLive();
    }
  })();
  </script>
</body>
</html>
